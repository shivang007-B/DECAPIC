<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050e0c"/>
      <stop offset="50%" stop-color="#07110f"/>
      <stop offset="100%" stop-color="#0b1a16"/>
    </linearGradient>
    <radialGradient id="tealGlow" cx="25%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#10c49f" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#10c49f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coralGlow" cx="80%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#ef7b5f" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#ef7b5f" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="400" rx="24" fill="url(#bgGrad)" stroke="#1b2f2a" stroke-width="2"/>
  <rect width="1200" height="400" rx="24" fill="url(#tealGlow)"/>
  <rect width="1200" height="400" rx="24" fill="url(#coralGlow)"/>

  <!-- Subtle Top Accent Border -->
  <line x1="100" y1="2" x2="1100" y2="2" stroke="#10c49f" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- Logo Group -->
  <g transform="translate(600, 155)" text-anchor="middle" filter="url(#shadow)">
    <!-- Brand Wordmark -->
    <text font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="105" letter-spacing="-2px">
      <!-- "Deca" in Tan -->
      <tspan fill="#c5aa8d" font-weight="200" dx="-10">Deca</tspan>
      <!-- "P" in White -->
      <tspan fill="#e9f6f2" font-weight="800">P</tspan>
      <!-- Dotless ı -->
      <tspan fill="#e9f6f2" font-weight="800" dx="-4">ı</tspan>
      <!-- "c" in White -->
      <tspan fill="#e9f6f2" font-weight="800" dx="-2">c</tspan>
    </text>

    <!-- Coral Dot precisely over the dotless ı -->
    <circle cx="83" cy="-78" r="7.5" fill="#ef7b5f" filter="url(#glow)"/>

    <!-- Signature Teal Heart Icon -->
    <g transform="translate(162, -72) scale(1.6)" filter="url(#glow)">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
            fill="none" stroke="#10c49f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Tagline -->
  <text x="600" y="222" text-anchor="middle" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="300" fill="#8fa89e" letter-spacing="0.5px">
    Every script, schedule, rupee and shot of a film production — in one frame.
  </text>

  <!-- Spec Pills / Badges -->
  <g transform="translate(600, 280)" text-anchor="middle">
    <!-- Center Pill -->
    <rect x="-380" y="-18" width="760" height="36" rx="18" fill="#0d1a17" stroke="#1b2f2a" stroke-width="1.5"/>
    <text y="5" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500" fill="#e9f6f2" letter-spacing="0.4px">
      <tspan fill="#10c49f" font-weight="700">52</tspan> MySQL Tables  ·  
      <tspan fill="#10c49f" font-weight="700">17</tspan> SQL Views  ·  
      <tspan fill="#10c49f" font-weight="700">7</tspan> Triggers  ·  
      <tspan fill="#ef7b5f" font-weight="700">7</tspan> ML Models  ·  
      <tspan fill="#c5aa8d" font-weight="700">0</tspan> Build Step SPA
    </text>
  </g>

  <!-- Brand Theme Palette Swatch Dots -->
  <g transform="translate(600, 342)" text-anchor="middle">
    <!-- Teal -->
    <circle cx="-160" cy="0" r="7" fill="#10c49f"/>
    <text x="-142" y="4" font-family="'Outfit', sans-serif" font-size="12" fill="#8fa89e" text-anchor="start">Teal (#10c49f)</text>

    <!-- Tan -->
    <circle cx="-30" cy="0" r="7" fill="#c5aa8d"/>
    <text x="-12" y="4" font-family="'Outfit', sans-serif" font-size="12" fill="#8fa89e" text-anchor="start">Tan (#c5aa8d)</text>

    <!-- Coral -->
    <circle cx="90" cy="0" r="7" fill="#ef7b5f"/>
    <text x="108" y="4" font-family="'Outfit', sans-serif" font-size="12" fill="#8fa89e" text-anchor="start">Coral (#ef7b5f)</text>
  </g>
</svg>

